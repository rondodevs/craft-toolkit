name: Release

# Composer installs the plugin from its tags, and doesn't build: each `v*` tag is moved onto a
# commit that adds the built CP app (src/web/dist), so `main` never carries build output.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Already moved by a previous run: nothing to add
      - name: Skip a built tag
        id: built
        run: echo "done=$(git ls-tree -d HEAD src/web/dist | grep -q dist && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.built.outputs.done == 'false'

      - uses: actions/setup-node@v7
        if: steps.built.outputs.done == 'false'
        with:
          node-version: 24
          cache: pnpm

      - if: steps.built.outputs.done == 'false'
        run: pnpm install --frozen-lockfile

      - if: steps.built.outputs.done == 'false'
        run: pnpm build

      - name: Move the tag onto a commit with the build
        if: steps.built.outputs.done == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force src/web/dist
          git commit -m "build: CP app for ${GITHUB_REF_NAME}"
          git tag --force "${GITHUB_REF_NAME}"
          git push --force origin "refs/tags/${GITHUB_REF_NAME}"
